ementById('prevMediaBtn')?.addEventListener('click',()=>{if(currentMediaList.length>1){currentMediaIndex=(currentMediaIndex-1+currentMediaList.length)%currentMediaList.length;loadMedia(currentMediaIndex);document.querySelectorAll('.media-thumb-item').forEach((tt,ti)=>tt.classList.toggle('active',ti===currentMediaIndex));document.querySelector('.media-thumb-item.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}});document.getElementById('nextMediaBtn')?.addEventListener('click',()=>{if(currentMediaList.length>1){currentMediaIndex=(currentMediaIndex+1)%currentMediaList.length;loadMedia(currentMediaIndex);document.querySelectorAll('.media-thumb-item').forEach((tt,ti)=>tt.classList.toggle('active',ti===currentMediaIndex));document.querySelector('.media-thumb-item.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}});}
